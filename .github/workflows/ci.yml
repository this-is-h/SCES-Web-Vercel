name: CI

on:
    pull_request:
    push:
        branches: [develop, main]

permissions:
    contents: read

jobs:
    branch-name:
        name: 分支名校验（简化版 Git Flow）
        runs-on: ubuntu-latest
        if: github.event_name == 'push'
        steps:
            - name: 校验分支前缀
              run: |
                  ref="${{ github.ref_name }}"
                  case "$ref" in
                    main|develop|feature/*|bugfix/*|hotfix/*|chore/*|release/*)
                      ;;
                    *)
                      echo "::error::分支名违规：$ref（须以 feature/ bugfix/ hotfix/ chore/ release/ 开头，或为 main/develop）"
                      exit 1
                      ;;
                  esac

    build-and-lint:
        name: 编译 + Lint + 类型检查
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 10.9.0
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: 编译门禁
              run: pnpm build
            - name: Lint 门禁
              run: pnpm lint

    unit-tests:
        # 仓库暂未建立测试基线（原测试文件被旧 *.test.js gitignore 吞掉且工作树已无）。
        # 首个测试文件落地后本门禁自动生效（按 Conventional Commits 推进覆盖率 ≥80%）。
        name: 单元测试
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 10.9.0
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: 单元测试门禁（无测试文件时自动跳过）
              run: |
                  if [ -n "$(find . -path ./node_modules -prune -o \( -name '*.test.*' -o -name '*.spec.*' \) -print 2>/dev/null | head -1)" ]; then
                    pnpm test:unit run
                  else
                    echo "::notice::未检出测试文件，跳过单元测试"
                  fi

    supply-chain-audit:
        name: 供应链安全检查
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 10.9.0
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm audit --prod --audit-level high

    gitleaks:
        name: 密钥泄漏扫描
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
